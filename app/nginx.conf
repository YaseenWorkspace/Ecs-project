server {
    # Same port as before, so the ALB target group and ECS task definition don't change.
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Health check for the pipeline and monitoring: always returns {"status":"ok"} as JSON.
    location = /health {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"status":"ok"}';
    }

    # Single-page app: serve the file if it exists, otherwise hand the route to React.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Built JS/CSS files have content hashes in their names, so they can be cached for a long time.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
